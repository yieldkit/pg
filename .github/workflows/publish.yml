name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

# One run per tag: a second release never cancels or replaces another one waiting for approval.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '26.13.1' # exact; its bundled npm (11.20.0) supports trusted publishing
  PNPM_VERSION: 12.23.0 # keep in sync with devEngines.packageManager in package.json
  TARBALL: pg.tgz

jobs:
  # Gate: only publish a stable version from a tag on main whose commit passed CI.
  verify:
    name: Verify release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      name: ${{ steps.manifest.outputs.name }}
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag matches a stable package.json version
        id: manifest
        run: |
          version=$(jq -r .version package.json)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Only stable versions can be published (got $version)."; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/v$version" ]] || {
            echo "::error::Run this from the tag v$version (got $GITHUB_REF)."; exit 1; }
          echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the commit is on main
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo '::error::The release commit is not on main.'; exit 1; }

      - name: Check CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --commit "$GITHUB_SHA" --event push --status success --limit 100 \
            --json databaseId --jq 'length')
          [[ "$count" -gt 0 ]] || {
            echo '::error::This commit needs a successful CI run on main.'; exit 1; }

  # Test against PostgreSQL in Docker (pinned images), then build and pack and upload the tarball
  # before any dependency outside the lockfile is installed.
  build:
    name: Build package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Format, lint and type checks
        run: pnpm check

      - run: pnpm test

      - name: Run the integration tests against PostgreSQL and PgBouncer in Docker
        run: pnpm test:integration

      - name: Build and pack with resolved catalog dependencies
        id: pack
        run: |
          pnpm pack --out "$RUNNER_TEMP/$TARBALL"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/$TARBALL" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/${{ env.TARBALL }}
          if-no-files-found: error
          retention-days: 35 # longer than the 30 days a deployment can wait for approval

  # Install the packed tarball into a fresh consumer. This resolves dependencies outside the
  # lockfile, so it runs on its own runner and can only fail the release, not change the tarball.
  smoke:
    name: Test package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}

      - name: Check the tarball is the one the build job packed
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  $RUNNER_TEMP/$TARBALL" | sha256sum --check --strict

      - name: Test the exact package to publish
        run: pnpm test:package "$RUNNER_TEMP/$TARBALL"

  # Publish the tested tarball. This is the only job with an OIDC token.
  publish:
    name: Publish to npm
    needs: [verify, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check the bundled npm supports trusted publishing
        run: |
          npm_version=$(npm --version)
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            process.exit(supported ? 0 : 1);
          ' "$npm_version" || { echo "::error::npm $npm_version cannot use trusted publishing."; exit 1; }

      - name: Check the tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF" --jq .sha)
          [[ "$tagged" == "$GITHUB_SHA" ]] || {
            echo "::error::$GITHUB_REF now points at $tagged, not the built commit $GITHUB_SHA."; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}

      - name: Check the tarball is the tested one for this release
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
          NAME: ${{ needs.verify.outputs.name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          echo "$SHA256  $RUNNER_TEMP/$TARBALL" | sha256sum --check --strict
          manifest=$(tar --extract --gzip --to-stdout --file "$RUNNER_TEMP/$TARBALL" package/package.json)
          [[ "$(jq -r .name <<< "$manifest")" == "$NAME" && "$(jq -r .version <<< "$manifest")" == "$VERSION" ]] || {
            echo "::error::The tarball is not $NAME@$VERSION."; exit 1; }

      - name: Publish with npm trusted publishing
        working-directory: ${{ runner.temp }}
        run: npm publish "$RUNNER_TEMP/$TARBALL" --access public --provenance --ignore-scripts
